[platform]
# env file that will be loaded on startup. if a relateive path is provided it would be
# resolved basing on <bos_dir>, which is the folder that this toml file is in.
#envfile = ".env"

# the env variables can be defined inline as well, that the platform will load on startup
#[platform.envs]

# The limit of the capabilites, like tools, skills and subagents, to be loaded into the context.
#BOS_CAPABILITY_LIMIT = 50

# a list of module names or paths where the platform would scan and load extendisons from.
# by default, the platform will load all the bos built in extension as well as
# the extensions under <bos_dir>/extensions
#extensions = ["bos.extensions.all", "./extentions"]

# a list of path where the platform would scan and load the agents definition spec, in addition
# to the agents configured inline in this file. for the agent specs with same name (role), the
# last loaded one will overwrite previous one. both .toml and .md are supported format for the
# individule agent config specs
# by default, the platform will scan the agents from <bos_dir>/agents
#agent_dirs = ["./agents"]

# defint he defualt setup for all agents
[platform.agent_defaults]

# a model for agent is almost mandatory unless you are using a llm provider that has built in
# default model. if you are using a customize llm provider, the model would have format like:
#    <provier name>/<model name the provier expects>
model = "gemini/gemini-3.1-pro-preview"

# the tools that is available for the agent. by default, the platform does not enable any tool
# to the agents. the tools set should be set explicity for the agent to access. you can provide
# a list of tool names or use wildcard to enable all the tools to the agent. to be noted, the
# tool names are case sensitive
#tools = ["ReadFile", "SearchFiles"]
#tools = "*"

# the skills that is avaialbie for the agent. the setting rules are same as tools.
#skills = ["brainstorming"]
#skills = "*"

# the subagents the agent can use with the AskSubAgent tool. the setting rules are same as tools.
#subagents = ["researcher"]
#subagents = "*"

# the maxims for this agent. it could be set in multiple forms. if not set, no maxims for the agent.
# 1. enable all the built in maxims, which are soul, user, identity and rules.
#maxims = "*"
# 2. enable subset of the built in maxims
#maxims = ["user", "soul"]
# 3. use customize maxims, where you need to provide a table for maxim definition
#maxims = {"user": "your knowledge about the user — preferences, background, projects, style", "identity": "who you are — your role, purpose, and context"}

#reasoning_effort = "medium"
#max_tokens = 131072
#max_iterations = 25


# [[platform.agents]]
# name = "bosai"
# description = "The main agent."

# # Agent `bosai` is authoritative. If an external file under .bos/agents/
# # defines the same exact name, e.g. `bosai.md`, the later-loaded definition wins.
# system_prompt = """
# You are an AI agent.
# """


[harness]
# Tool-specific runtime configuration is passed to tools as `tool_config`.
# Uncomment to prefer Tavily for WebSearch and fall back to DuckDuckGo on quota/rate-limit/server errors.
#
#[harness.tools.WebSearch]
#priority = ["tavily", "duckduckgo"]
#timeout_seconds = 15
#max_results = 5
#
#[harness.tools.WebSearch.providers.tavily]
#api_key_env = "TAVILY_API_KEY"
#search_depth = "basic"
#fallback_on_status = [429, 432, 433, 500, 502, 503, 504]

[harness.skills_loader]
skill_dirs = ["skills"]

[harness.memory]
name = "MarkdownMemoryExtension"
store_dir = "memories"

# [harness.message_store]
# configure the storage path for the builtin jsonl message store
# default is <bos_dir>/messages
# store_dir = "./messages"

[harness.mail_route]
name = "JsonlMailRoute"
store_dir = "mailboxes"

[harness.subagent_defaults]
task_template = """
--- Sub-agent Instructions ---
You are a background sub-agent `{role}`. Work only on the delegated task,
use only the tools available to you, do not ask the user questions, and finish with
a concise result. You can only modify or create files under {workspace}.
--- Task Description ---
{task}
"""

[main]
# agent = "main"

[main.runtime]
kind = "process" # set to "docker" to make `bos start` launch a container
# image = "ghcr.io/your-org/bos-ai:latest"

[[main.channels]]
name = "HttpChannel"
bind_address = "channel@http"
target_address = "agent@main"
host = "127.0.0.1"            # automatically becomes 0.0.0.0 in Docker
port = 5920

#[[main.channels]]
#name = "TelegramChannel"
#bind_address = "channel@telegram"
#target_address = "agent@main"
#token = "123456:telegram-bot-token"
#poll_timeout = 30
#allowed_chat_ids = [123456789]        # optional allowlist
