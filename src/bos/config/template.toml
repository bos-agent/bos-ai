[platform]
# env file that will be loaded on startup. if a relative path is provided it would be
# resolved basing on <bos_dir>, which is the folder that this toml file is in.
#envfile = ".env"

# the env variables can be defined inline as well, that the platform will load on startup
#[platform.envs]
#BOS_MODEL=
#BOS_CONSOLIDATOR_MODEL=
#BOS_CAPABILITY_LIMIT=50

# a list of module names or paths where the platform would scan and load extensions from.
# by default, the platform will load all the bos built in extension as well as
# the extensions under <bos_dir>/extensions
#extensions = ["bos.exts", "./extensions"]

# a list of path where the platform would scan and load the agents definition spec, in addition
# to the agents configured inline in this file. for the agent specs with same name (role), the
# last loaded one will overwrite previous one. both .toml and .md are supported format for the
# individual agent config specs
# by default, the platform will scan the agents from <bos_dir>/agents
#agent_dirs = ["./agents"]

# ── Harness ─────────────────────────────────────────────────────────
# Select extension implementations for harness-level services
[harness]
consolidator = "_default"
chat_store = "_default"
mail_route = "_default"

# Ordered chain of turn interceptors
#interceptors = ["logging", "rate_limit"]

# ── Extension Configurations ────────────────────────────────────────

# LLM provider defaults
# [exts.ep_provider._default]

[exts.ep_consolidator._default]
model = "gemini/gemini-2.5-flash"

# [exts.ep_chat_store._default]
# store_dir = "./messages"

# [exts.ep_mail_route._default]
# store_dir = "./mailboxes"

# Plugin-defined extension points use the pep_ prefix
# [exts.pep_skills_loader._default]
# skill_dirs = ["skills"]

# Tool-specific runtime configuration
# [exts.ep_tool.WebSearch]
# priority = ["tavily", "duckduckgo"]
# timeout_seconds = 15
# max_results = 5
#
# [exts.ep_tool.WebSearch.tavily]
# api_key_env = "TAVILY_API_KEY"
# search_depth = "basic"
# fallback_on_status = [429, 432, 433, 500, 502, 503, 504]

# ── Agent Defaults ──────────────────────────────────────────────────

[agent.defaults]
# usaullay not going to use it. each agent should override
#system_prompt = "you are the bos agent that help user with anything."

# defautl model for all agent. the precedence is: <agent_name>.model > platform.agent_defaults.model > BOS_MODEL > platform.ep_provider.<provider name>.model
#model = "gpt-4o"

# the name of the agent, usually be used in the named agent / actor
#agent_name = "bos"

# other settings
#reasoning_effort = "medium"           # low, medium, high
#max_tokens = 131072
#max_iterations = 60
#tool_noise_filter = "keep_signatures" # keep_all, keep_signatures, strip_all

[agent.defaults.tools]
enabled = ["*"]
#disabled = ["WriteFile"]
#usages = {}

[agent.defaults.plugins]
enabled = [
    "*",
] # ["MemoryPlugin", "PlanPlugin", "TaskPlugin", "SkillsPlugin", "SubagentPlugin"]
#disabled = []
#prompts = {}

# Per-plugin configuration
# [agent.defaults.plugin-bindings.MemoryPlugin]
# maxims = ["user", "soul", "identity", "rules"]
# scope = "workspace"

[agent.defaults.plugin-bindings.SubagentPlugin]
task_template = """
--- Sub-agent Instructions ---
You are a background sub-agent `{role}`. Work only on the delegated task,
use only the tools available to you, do not ask the user questions, and finish with
a concise result.
If you cannot finish the task for some reason, please call it out in the response,
instead of return empty message
--- Task Description ---
{task}
"""

# ── Named Agents ────────────────────────────────────────────────────

# [agents.main]
# system_prompt = "You are the main BOS agent."
# tools = { enabled = ["AskSubagent"] }

# [agents.researcher]
# system_prompt = "You research codebases."
# tools = { enabled = ["ReadFile", "WebSearch"] }

# ── Runtime ─────────────────────────────────────────────────────────

[runtime]
location = "process"
default_actor = "main"

[runtime.gateway]
host = "127.0.0.1"
# 0 = let the system assign a free port; clients discover it via gateway.state.
port = 0
api_key_env = "BOS_GATEWAY_API_KEY"

[runtime.actors.main]
agent = "main"
display_name = "Main"

# Per-actor agent config overrides use the same shape as [agent.defaults].
# [runtime.actors.main.agent_cfg.tools]
# disabled = ["abc"]

# Additional actors can be addressed with @actor-name mentions.
# [runtime.actors.researcher]
# agent = "researcher"
# display_name = "Researcher"

# Persistent channels use the gateway channel constructor contract.
# [[runtime.channels]]
# type = "TelegramChannel"
# channel_id = "telegram:main"
# display_name = "Telegram"
# target_actor = "main"
# settings = { bot_id = "123456", token_env = "TELEGRAM_BOT_TOKEN" }

# Lark / Feishu bot over the lark-oapi WebSocket long connection (no public URL
# needed). Install the optional dependency: uv pip install 'bos-ai[lark]'.
# Enable the "im.message.receive_v1" event and "Use long connection to receive
# events" in the Lark developer console.
# [[runtime.channels]]
# type = "LarkChannel"
# channel_id = "lark:main"
# display_name = "Lark"
# target_actor = "main"
# settings = { app_id_env = "LARK_APP_ID", app_secret_env = "LARK_APP_SECRET" }
