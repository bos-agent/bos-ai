# BOS default preset — uses Python default_agent_spec for the BOS agent.
# Agent persistent storage is at ~/.bos/agents/default.

[harness]
consolidator = "LLMConsolidator"
chat_store = "JsonlChatStore"
mail_route = "JsonlMailRoute"

[runtime]
location = "process"
main_actor = "main"

[runtime.gateway]
host = "127.0.0.1"
port = 0
api_key_env = "BOS_GATEWAY_API_KEY"

[runtime.actors.main]
agent = "BOS"
display_name = "Main"
