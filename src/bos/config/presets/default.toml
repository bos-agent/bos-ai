# BOS default preset — uses the built-in bos_agent ep_agent factory for the BOS agent.
# Agent persistent storage is at ~/.bos/agents/default.

[harness]
consolidator = "LLMConsolidator"
chat_store = "JsonlChatStore"
mail_route = "JsonlMailRoute"

[runtime]
main_actor = "main"

[runtime.gateway]
host = "127.0.0.1"
port = 0
api_key_env = "BOS_GATEWAY_API_KEY"

[runtime.actors.main]
agent = "BOS"
display_name = "Main"
