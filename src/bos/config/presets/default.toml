# BOS default preset — uses Python default_agent_spec for the _default agent.
# Agent persistent storage is at ~/.bos/agents/default.

[harness]
consolidator = "_default"
chat_store = "_default"
mail_route = "_default"

[runtime]
location = "process"
default_actor = "main"

[runtime.gateway]
host = "127.0.0.1"
port = 5920
api_key_env = "BOS_GATEWAY_API_KEY"

[runtime.actors.main]
agent = "_default"
display_name = "Main"
