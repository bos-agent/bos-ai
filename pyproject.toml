[project]
name = "bos-ai"
version = "1.10.0"
description = "An agent out of the box. A framework for your own agent-native applications."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "litellm==1.84.0",
    "python-dotenv==1.2.2",
    "filelock==3.25.2",
    "click==8.3.2",
    "rich==14.3.3",
    "textual==8.2.3",
    "prompt_toolkit==3.0.52",
    "tomli==2.0.1; python_version<'3.11'",
    "beautifulsoup4==4.14.3",
    "aiohttp==3.13.5",
    "textual-autocomplete==4.0.6",
    "pydantic==2.12.5",
    "ddgs==9.14.4",
    "tomlkit==0.15.0",
    "pyyaml==6.0.3",
    "jsonschema>=4.21",
]

[project.urls]
Homepage = "https://github.com/bos-agent/bos-ai"


[project.scripts]
boscli = "bos.cli.entry:main"

[project.optional-dependencies]
search = ["tavily-python==0.7.23"]
lark = ["lark-oapi==1.6.8"]
all = ["tavily-python==0.7.23", "lark-oapi==1.6.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bos"]

[dependency-groups]
dev = [
    "ipdb==0.13.13",
    "pre-commit==4.6.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.10",
    "semble==0.2.0",
]

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "I"]

[tool.ruff.format]
preview = true

[tool.semantic_release]
allow_zero_version = true
version_toml = ["pyproject.toml:project.version"]
commit_author = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
commit_message = "chore(release): {version} [skip ci]"
build_command = "python -m ensurepip --upgrade && python -m pip install build && python -m build"
commit_parser = "conventional"
commit_parser_options = { parse_squash_commits = false, ignore_merge_commits = true }

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
mask_initial_release = false

[tool.uv]
preview = true
add-bounds = "exact"
