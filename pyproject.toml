[project]
name = "bos-ai"
version = "2.1.0"
description = "An agent out of the box. A framework for your own agent-native applications."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.21",
    "filelock==3.25.2",
    "pydantic==2.12.5",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
]

[project.urls]
Homepage = "https://github.com/bos-agent/bos-ai"


[project.optional-dependencies]
litellm = ["litellm==1.84.0"]
gateway = [
    "starlette==1.6.0",
    "uvicorn==0.53.0",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    # 15.x, not 17.x: lark-oapi pins websockets>=11,<16, and the `all` extra has
    # to resolve. Everything this uses — asyncio.client.connect, InvalidStatus
    # carrying the denial response body, protocol.State — is present in 15.
    "websockets==15.0.1",
]
search = ["ddgs==9.14.4", "beautifulsoup4==4.14.3"]
lark = ["lark-oapi==1.6.8"]
# bos.cli imports bos.gateway.client for the TUI's WebSocket connection.
cli = [
    "bos-ai[gateway]",
    "click==8.3.2",
    "rich==14.3.3",
    "textual==8.2.3",
    "prompt_toolkit==3.0.52",
    "textual-autocomplete==4.0.6",
]
all = ["bos-ai[litellm,gateway,search,lark,cli]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bos"]

[dependency-groups]
dev = [
    # Every extra, so a plain `uv sync` still yields a runnable CLI and a
    # collectable test suite. Without it the extras split (BEP 16) leaves the
    # dev venv without click/starlette/litellm and 16 test modules fail to import.
    "bos-ai[all]",
    "ipdb==0.13.13",
    "mcp>=2,<3",
    "pre-commit==4.6.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.1.0",
    "ruff==0.15.10",
    "semble==0.2.0",
]

[tool.ruff]
line-length = 120
lint.select = ["E", "F", "I"]

[tool.ruff.format]
preview = true

[tool.semantic_release]
allow_zero_version = true
version_toml = ["pyproject.toml:project.version"]
commit_author = "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
commit_message = "chore(release): {version} [skip ci]"
build_command = "python -m ensurepip --upgrade && python -m pip install build && python -m build"
commit_parser = "conventional"
commit_parser_options = { parse_squash_commits = false, ignore_merge_commits = true }

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
mask_initial_release = false

[tool.uv]
preview = true
add-bounds = "exact"
