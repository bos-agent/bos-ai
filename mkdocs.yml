site_name: BOS
site_description: Lightweight single-file agent framework — from zero to agent in a single command.
site_url: https://bos-agent.github.io/bos-ai/
repo_url: https://github.com/bos-agent/bos-ai
repo_name: bos-agent/bos-ai
edit_uri: edit/main/docs/site/

docs_dir: docs/site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - CLI: cli/index.md
  - Architecture:
      - Overview: architecture/index.md
      - BEP Index: architecture/beps.md
