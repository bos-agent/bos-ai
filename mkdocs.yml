site_name: BOS
site_description: An agent out of the box. A framework for your own agent-native applications.
site_url: https://bos-agent.github.io/bos-ai/
repo_url: https://github.com/bos-agent/bos-ai
repo_name: bos-agent/bos-ai
edit_uri: edit/main/docs/site/

docs_dir: docs/site

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Tutorials:
      - Overview: tutorials/index.md
      - 1. Your first agent: tutorials/first-agent.md
      - 2. Create a project: tutorials/create-a-project.md
      - 3. Add a custom tool: tutorials/custom-tool.md
      - 4. Delegate to sub-agents: tutorials/subagents.md
      - 5. Connect a channel: tutorials/channels.md
      - 6. Package & share extensions: tutorials/package-extension.md
  - Concepts:
      - Overview: concepts/index.md
      - Runtime & gateway: concepts/runtime.md
      - Agents & actors: concepts/agents-and-actors.md
      - Memory & skills: concepts/memory-and-skills.md
  - Configuration: configuration/index.md
  - Extending BOS:
      - Overview: extending/index.md
      - Tools: extending/tools.md
      - Plugins: extending/plugins.md
      - Channels: extending/channels.md
      - Stores & providers: extending/stores-and-providers.md
      - Packaging & entry points: extending/entry-points.md
  - CLI: cli/index.md
  - Architecture:
      - Overview: architecture/index.md
      - BEP Index: architecture/beps.md
