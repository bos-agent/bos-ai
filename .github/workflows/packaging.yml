name: Packaging

on:
  pull_request:
  push:
    branches: [main]

jobs:
  base-install:
    name: Base install is a library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      # Extras govern which dependencies are installed, not which files ship, so
      # only a real install can catch a dependency landing in the wrong extra.
      # The ring-isolation guards check import direction, not this.
      - name: Base distribution installs and imports with no console script
        run: ./scripts/check_base_install.sh

      # Installed without extras on purpose: the example registers its own
      # provider, so an embedder supplying their own model client needs nothing
      # beyond the base distribution.
      - name: Embedding example runs against a base install
        run: |
          uv venv --python 3.13 /tmp/embed
          VIRTUAL_ENV=/tmp/embed uv pip install --quiet . fastapi httpx
          VIRTUAL_ENV=/tmp/embed /tmp/embed/bin/python - <<'PY'
          from fastapi.testclient import TestClient

          from examples.embed_fastapi import app

          with TestClient(app) as client:
              response = client.post("/ask", json={"chat_id": "ci", "message": "hello"})
          assert response.status_code == 200, response.text
          assert "echo: hello" in response.json()["reply"], response.json()
          print("embed example OK on a base install")
          PY

      # No extras on purpose: bos.sdk's contract stays base-install only, which
      # is the whole point of examples/embed_sdk.py. A fresh venv with no
      # extras is what would catch bos.sdk acquiring a dependency.
      - name: Embedding SDK example runs against a base install
        run: |
          uv venv --python 3.13 /tmp/embed-sdk
          VIRTUAL_ENV=/tmp/embed-sdk uv pip install --quiet .
          VIRTUAL_ENV=/tmp/embed-sdk /tmp/embed-sdk/bin/python - <<'PY'
          import subprocess

          result = subprocess.run(
              ["/tmp/embed-sdk/bin/python", "examples/embed_sdk.py"],
              capture_output=True,
              text=True,
          )
          print(result.stdout)
          assert result.returncode == 0, result.stderr
          # The message count rising from turn 1 to turn 2 is the first turn
          # showing up in the second turn's history — same chat_id, no API.
          assert "history: 2 messages" in result.stdout, result.stdout
          assert "history: 4 messages" in result.stdout, result.stdout
          print("embed sdk example OK on a base install")
          PY

      # Needs [gateway], unlike the example above: the mounted gateway is the
      # gateway, not just its ASGI wrapper. A fresh venv is what would catch a
      # gateway dependency landing in the wrong extra.
      - name: Embedded gateway example runs against a gateway install
        run: |
          uv venv --python 3.13 /tmp/embed-gateway
          VIRTUAL_ENV=/tmp/embed-gateway uv pip install --quiet '.[gateway]' fastapi httpx
          VIRTUAL_ENV=/tmp/embed-gateway /tmp/embed-gateway/bin/python - <<'PY'
          from fastapi.testclient import TestClient

          from examples.embed_gateway_fastapi import make_app

          with TestClient(make_app()) as client:
              status = client.get("/bos/api/status")
              assert status.status_code == 200, status.text
              body = status.json()
              assert body["runtime"] == "embedded", body
              assert body["state"] == "live", body

              restart = client.post("/bos/api/restart")
              assert restart.status_code == 200, restart.text
              assert restart.json() == {"ok": True, "state": "live"}, restart.json()
          print("embedded gateway example OK on a gateway install")
          PY
