name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: pytest, ruff, pyright
    runs-on: ubuntu-latest
    # requires-python is >=3.13, so an unpinned runner is free to pick 3.14 (it
    # did). Pin to what packaging.yml builds against and CLAUDE.md documents.
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Plain `uv sync`, on purpose: it is what a fresh clone runs, and the dev
      # group is what makes the extras (BEP 16) present. If that drifts, 16 test
      # modules stop importing and this job is the only thing that would notice.
      - name: Sync
        run: uv sync

      # The Claude Code CLI's bash sandbox on Linux needs bubblewrap and socat on PATH.
      # Without them the sandbox vendor facts (6, 6b, 6c in
      # tests/test_claude_code_vendor_facts.py) skip, and so would every sandbox
      # confinement test built on them — the security tests would never run in CI.
      # Ubuntu 24.04 also restricts unprivileged user namespaces through AppArmor,
      # which can leave bwrap installed but unable to start a sandbox; the sysctl lifts
      # that for this VM, where the kernel has the setting. `apt-get update` first,
      # because a hosted runner's package index can be stale.
      - name: Install the bash sandbox's dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Tests
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check src tests examples

      # pyright is not a project dependency and finds no .venv to fall back on —
      # uv keeps the project environment under its cache dir on a runner — so
      # name the interpreter, or every third-party import reports unresolved.
      - name: Type-check
        run: npx -y pyright --pythonpath "$(uv run python -c 'import sys; print(sys.executable)')" src
