name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: pytest, ruff, pyright
    runs-on: ubuntu-latest
    # requires-python is >=3.13, so an unpinned runner is free to pick 3.14 (it
    # did). Pin to what packaging.yml builds against and CLAUDE.md documents.
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Plain `uv sync`, on purpose: it is what a fresh clone runs, and the dev
      # group is what makes the extras (BEP 16) present. If that drifts, 16 test
      # modules stop importing and this job is the only thing that would notice.
      - name: Sync
        run: uv sync

      - name: Tests
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check src tests examples

      # pyright is not a project dependency and finds no .venv to fall back on —
      # uv keeps the project environment under its cache dir on a runner — so
      # name the interpreter, or every third-party import reports unresolved.
      - name: Type-check
        run: npx -y pyright --pythonpath "$(uv run python -c 'import sys; print(sys.executable)')" src
